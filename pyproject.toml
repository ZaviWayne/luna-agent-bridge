[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luna-agent-bridge"
version = "0.2.0"
description = "Native-first Codex subagent coordination with an optional cross-session bridge"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["PyYAML>=6.0"]

[project.scripts]
luna-agent = "luna_agent_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
